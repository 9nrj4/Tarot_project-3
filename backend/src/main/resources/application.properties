server.port=8080
spring.application.name=tarot-backend

# Google AI API Configuration
google.ai.api-key=AIzaSyAMFdolWIuPRYqF5rG-kKb8r0oQgFQl0wk

# Directories
session.dir=${SESSION_DIR:./data/sessions}
cards.images.dir=${CARDS_IMAGES_DIR:./static/images/tarot}

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null


# ===============================
# Database (H2 demo / dev)
# ===============================
# Упрощённый URL без опций AUTO_SERVER/DB_CLOSE_ON_EXIT,
# чтобы избежать ошибки "Feature not supported" в H2 2.2.x
spring.datasource.url=jdbc:h2:file:./data/tarot-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Включаем H2-консоль для отладки (на проде лучше выключить)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.tarot=DEBUG

# Явно указываем диалект H2, чтобы Hibernate корректно инициализировался
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

